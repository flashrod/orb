name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      windows:
        description: Build an unsigned Windows installer too
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  mac:
    name: macOS arm64
    runs-on: macos-14
    env:
      # Base64 of the App Store Connect .p8 key. Empty until signing is set up.
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Build app
        run: npm run build

      - name: Prepare App Store Connect API key
        if: env.APPLE_API_KEY_BASE64 != ''
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # electron-builder treats an empty CSC_LINK as a path and resolves it
          # to the project directory, then fails with "<dir> not a file". Empty
          # secrets must look unset, not empty.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID \
                      APPLE_API_ISSUER APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npx electron-builder --mac --arm64 --publish always
          else
            npx electron-builder --mac --arm64 --publish never
          fi

      - name: Upload unsigned build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: orb-macos-unsigned
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Attach release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # electron-builder's releaseInfo.releaseNotesFile did not reach the
          # GitHub release body, so set it explicitly after publishing.
          if [ -f docs/release-notes.md ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi

      - name: Mark prerelease
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease

  windows:
    name: Windows x64 (unsigned)
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: orb-windows-unsigned
          path: release/*.exe
          if-no-files-found: error
